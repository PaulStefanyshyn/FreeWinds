{% extends "base.html" %}

{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/menu.css') }}">
{% endblock %}

{% block content %}
{% include 'header.html' %}

<div class="food-menu">
    <div class="page-title">
        <p class="eyebrow">Restaurant</p>
        <h1>Меню</h1>
        <p>Сніданки, напої та страви для спокійного відпочинку протягом дня.</p>
    </div>

    <div class="type">
        <button class="active" type="button" disabled>Завантаження...</button>
    </div>

    <div id="catalog">
        <div class="menu-loading">Завантажуємо меню...</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let menuCategories = [];

    function getTypeListBtn() {
        const btn_catalog = document.querySelector('.type');
        btn_catalog.innerHTML = "";

        menuCategories.forEach((category, index) => {
            const btn = document.createElement('button');
            btn.type = "button";
            btn.textContent = category.name;
            btn.dataset.categoryId = category.id;
            btn.onclick = function () {
                getButton(this);
            };

            if (index === 0) {
                btn.classList.add('active');
            }

            btn_catalog.appendChild(btn);
        });
    }

    function getButton(button) {
        if (!button) {
            return;
        }

        const button_container = ".type";
        change_active(button_container, button);

        const categoryId = Number(button.dataset.categoryId);
        const category = menuCategories.find(item => item.id === categoryId);
        const menu_block = document.getElementById('catalog');

        menu_block.innerHTML = "";

        if (!category || category.items.length === 0) {
            menu_block.innerHTML = '<div class="empty-state"><h3>Поки немає страв</h3><p>Спробуйте іншу категорію.</p></div>';
            return;
        }

        category.items.forEach(menu => {
            const card = create_menu_card(menu.name, menu.price, menu.image_url, menu.description);
            menu_block.appendChild(card);
        });
    }

    function create_menu_card(name, price, image, text) {
        const card = document.createElement("div");
        card.classList.add("card");

        const img = document.createElement("img");
        img.src = image || "/static/img/vodogray.png";
        img.alt = name;

        const description = document.createElement("div");
        description.classList.add("description");

        const title = document.createElement("h2");
        title.textContent = name;

        const pricelot = document.createElement("p");
        pricelot.textContent = Number(price).toFixed(0);

        description.appendChild(title);

        if (text) {
            const details = document.createElement("span");
            details.textContent = text;
            description.appendChild(details);
        }

        description.appendChild(pricelot);

        card.appendChild(img);
        card.appendChild(description);
        card.tabIndex = 0;

        return card;
    }

    function change_active(phather_class_name, current_element) {
        const buttons = document.querySelectorAll(`${phather_class_name} button`);

        buttons.forEach(element => {
            if (element == current_element) {
                element.classList.add("active");
            } else {
                element.classList.remove("active");
            }
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadMenu();
    });

    async function loadMenu() {
        const menu_block = document.getElementById('catalog');
        const buttons = document.querySelector('.type');
        try {
            const response = await fetch('/api/menu');
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || "Не вдалося завантажити меню");
            }

            menuCategories = data.categories || [];
            if (menuCategories.length === 0) {
                buttons.innerHTML = "";
                menu_block.innerHTML = '<div class="empty-state"><h3>Меню поки порожнє</h3><p>Страви зʼявляться після оновлення адміністратором.</p></div>';
                return;
            }

            getTypeListBtn();
            getButton(document.querySelector(".type button.active"));
        } catch (error) {
            buttons.innerHTML = '<button type="button" disabled>Недоступно</button>';
            menu_block.innerHTML = '<div class="empty-state"><h3>Не вдалося завантажити меню</h3><p>Перевірте підключення або спробуйте пізніше.</p><button class="secondary" type="button" id="retry_menu">Спробувати ще раз</button></div>';
            document.getElementById("retry_menu").onclick = loadMenu;
        }
    }
</script>
{% endblock %}
