{% extends "admin/base.html" %}

{% block eyebrow %}Restaurant{% endblock %}
{% block title %}{{ 'Edit dish' if item else 'New dish' }}{% endblock %}

{% block content %}
<form method="post" enctype="multipart/form-data" class="admin-panel admin-form wide-form">
    <div class="panel-head">
        <h2>{{ item.name if item else 'Нова страва' }}</h2>
        <a href="{{ url_for('admin_menu') }}">Back to menu</a>
    </div>

    <div class="form-grid">
        <label>
            <span>Назва</span>
            <input name="name" value="{{ item.name if item else '' }}" required>
        </label>
        <label>
            <span>Категорія</span>
            <select name="category_id" required>
                {% for category in categories %}
                <option value="{{ category.id }}" {{ 'selected' if item and item.category_id == category.id else '' }}>{{ category.name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            <span>Ціна, грн</span>
            <input name="price" type="number" min="0" step="0.01" value="{{ item.price if item else '' }}" required>
        </label>
        <label>
            <span>Порядок</span>
            <input name="sort_order" type="number" value="{{ item.sort_order if item else 0 }}">
        </label>
        <label class="full">
            <span>Опис</span>
            <textarea name="description" rows="4">{{ item.description if item else '' }}</textarea>
        </label>
        <label>
            <span>Image URL</span>
            <input name="image_url" value="{{ item.image_url if item else '' }}" placeholder="/static/img/vodogray.png">
        </label>
        <label>
            <span>Upload image</span>
            <input name="image_file" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
        </label>
    </div>

    {% if item and item.image_url %}
    <div class="image-preview-row">
        <img src="{{ item.image_url }}" alt="{{ item.name }}">
        <label class="check-row">
            <input type="checkbox" name="remove_image" value="1">
            <span>Remove current image</span>
        </label>
    </div>
    {% endif %}

    <div class="check-grid">
        <label class="check-row">
            <input type="checkbox" name="is_available" value="1" {{ 'checked' if not item or item.is_available else '' }}>
            <span>Available for clients</span>
        </label>
        <label class="check-row">
            <input type="checkbox" name="is_active" value="1" {{ 'checked' if not item or item.is_active else '' }}>
            <span>Active</span>
        </label>
    </div>

    <div class="form-actions">
        <button type="submit" class="admin-primary">Save dish</button>
        <a class="admin-secondary" href="{{ url_for('admin_menu') }}">Cancel</a>
    </div>
</form>
{% endblock %}
