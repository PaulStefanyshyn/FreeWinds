{% extends "admin/base.html" %}

{% block eyebrow %}Операції{% endblock %}
{% block title %}Бронювання послуг{% endblock %}

{% block content %}
<section class="admin-panel">
    <form class="filter-bar" method="get">
        <label>
            <span>Період</span>
            <select name="period">
                {% for value, label in [('today', 'Сьогодні'), ('upcoming', 'Майбутні'), ('past', 'Минулі'), ('all', 'Усі')] %}
                <option value="{{ value }}" {{ 'selected' if filters.period == value else '' }}>{{ label }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            <span>Статус</span>
            <select name="status">
                <option value="">Усі</option>
                {% for status in statuses %}
                <option value="{{ status }}" {{ 'selected' if filters.status == status else '' }}>{{ status_labels.get(status, status) if status_labels else status }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            <span>Дата</span>
            <input type="date" name="date" value="{{ filters.date or '' }}">
        </label>
        <label class="wide">
            <span>Пошук</span>
            <input name="q" value="{{ filters.q or '' }}" placeholder="Клієнт, username, телефон, послуга">
        </label>
        <button type="submit" class="admin-primary">Фільтрувати</button>
    </form>

    {% include "admin/partials/booking_table.html" %}
</section>
{% endblock %}
