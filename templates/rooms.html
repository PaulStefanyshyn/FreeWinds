{% extends "base.html" %}

{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/rooms.css') }}">
{% endblock %}

{% block content %}
<div class="rooms">
    <div class="title">
        <h1>Номери</h1>
        <p>Затишок серед гір і лісу</p>
    </div>

    <div class="calendars_button">
        <div id="selected_date">
            <img src="{{ url_for('static', filename='img/calendar.png') }}" alt="">
            <p id="for"></p>
            <p id="to"></p>
        </div>
    </div>

    <div id="calendar"></div>

    <div id="rooms"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const clicked_date = [];

    const rooms = [
        { name: "Лісова хатина", description: "Дерев'яна хатина на узліссі з каміном.", price: 2400, img: "/static/img/vodogray.png", link: "/" },
        { name: "Гірський люкс", description: "Панорамні вікна на хребти Карпат.", price: 3800, img: "/static/img/vodogray.png", link: "/" },
        { name: "Гірський люкс 2", description: "Панорамні вікна на хребти Карпат.", price: 3900, img: "/static/img/vodogray.png", link: "/" }
    ]

    function create_calendar() {
        const calendar_block = document.getElementById('calendar');

        const month_block = document.createElement('div');
        month_block.classList.add('month');

        const prev_btn = document.createElement('button');
        prev_btn.classList.add('prev_month');

        const next_btn = document.createElement('button');
        next_btn.classList.add('next_month');

        const month = document.createElement('h2');

        const today = new Date();
        const curent_month = today.getMonth();
        const curent_year = today.getFullYear();
        let new_year = curent_year;

        let date = new Date(new_year, curent_month, 1);

        month.textContent = `${date.toLocaleString('uk-UA', { month: 'long' })}, ${new_year}`;

        month.dataset.month = curent_month + 1;
        month.dataset.year = new_year;

        next_btn.onclick = function () {
            const prev_month = Number(month.dataset.month);
            const prev_year = Number(month.dataset.year);
            let new_month = prev_month + 1;

            if (new_month > 12) {
                new_month = 1;
                new_year = prev_year + 1;
            }

            month.dataset.month = new_month;
            month.dataset.year = new_year;

            date = new Date(new_year, new_month - 1, 1);
            month.textContent = `${date.toLocaleString('uk-UA', { month: 'long' })}, ${new_year}`;

            get_dates(new_year, new_month, calendar_block);
        }

        prev_btn.onclick = function () {
            const prev_month = Number(month.dataset.month);
            const prev_year = Number(month.dataset.year);
            let new_month = prev_month - 1;

            if (new_month < 1) {
                new_month = 12;
                new_year = prev_year - 1;
            }

            if (
                new_year > curent_year ||
                (new_year === curent_year && new_month >= curent_month + 1)
            ) {
                date = new Date(new_year, new_month - 1, 1);
                month.textContent = `${date.toLocaleString('uk-UA', { month: 'long' })}, ${new_year}`;

                month.dataset.month = new_month;
                month.dataset.year = new_year;

                get_dates(new_year, new_month, calendar_block);
            }
        };

        month_block.appendChild(prev_btn);
        month_block.appendChild(month);
        month_block.appendChild(next_btn);

        calendar_block.appendChild(month_block);
    }

    function get_dates(year, month, father_block) {
        let weeks_day_container = document.querySelector('.week_day');

        if (!weeks_day_container) {
            weeks_day_container = document.createElement('div');
            weeks_day_container.classList.add('week_day');
        }

        const getDayNames = (locale = 'en-US', format = 'long') => {
            const formatter = new Intl.DateTimeFormat(locale, {
                weekday: format
            });

            return Array.from({ length: 7 }, (_, i) =>
                formatter.format(new Date(2025, 0, 5 + i))
            );
        };

        const days = getDayNames('uk-UA', 'short');

        weeks_day_container.innerHTML = "";

        days.forEach(element => {
            const day_name = document.createElement('p');
            day_name.textContent = element;

            weeks_day_container.appendChild(day_name);
        });

        father_block.appendChild(weeks_day_container);

        const daysInMonth = new Date(year, month, 0).getDate();


        let days_block = document.querySelector('.days');

        if (!days_block) {
            days_block = document.createElement('div');
            days_block.classList.add('days');
        }

        days_block.innerHTML = "";

        let start_day = new Date(year, month - 1, 1).getDay();

        for (let i = 0; i < start_day; i++) {
            const element = document.createElement('p');

            days_block.appendChild(element);
        }

        for (let day = 0; day < daysInMonth; day++) {
            const element = document.createElement('p');
            element.textContent = day + 1;

            element.onclick = function () {
                const value = Number(element.textContent);

                if (clicked_date.length === 0) {
                    clicked_date.push(value);
                }
                else if (clicked_date.length === 1) {
                    const start = Math.min(clicked_date[0], value);
                    const end = Math.max(clicked_date[0], value);

                    // Очистити старий масив
                    clicked_date.length = 0;

                    // Додати всі дні діапазону
                    for (let day = start; day <= end; day++) {
                        clicked_date.push(day);
                    }
                }
                else {
                    // Почати новий вибір
                    clicked_date.length = 0;
                    clicked_date.push(value);
                }

                const dat = document.querySelectorAll('.days p');

                dat.forEach(el => {
                    const day = Number(el.textContent);

                    el.classList.remove('active', 'include');

                    if (clicked_date.length === 1) {
                        if (day === clicked_date[0]) {
                            el.classList.add('active');
                        }
                    }
                    else {
                        // Перший і останній
                        if (
                            day === clicked_date[0] ||
                            day === clicked_date[clicked_date.length - 1]
                        ) {
                            el.classList.add('active');
                        }

                        // Всі дні всередині
                        else if (clicked_date.includes(day)) {
                            el.classList.add('include');
                        }
                    }
                });

                const first_date = document.getElementById('for');
                const last_date = document.getElementById('to');

                let first_day_date = new Date(year, month - 1, clicked_date[0]);
                let last_day_date = new Date(year, month - 1, clicked_date.at(-1));

                first_date.textContent = `${clicked_date[0]} ${first_day_date.toLocaleString('uk-UA', { month: 'short' })}`;
                last_date.textContent = `${clicked_date.at(-1)} ${last_day_date.toLocaleString('uk-UA', { month: 'short' })}`;

            };

            days_block.appendChild(element);
        }

        father_block.appendChild(days_block);
    }

    function fill_rooms() {
        const rooms_container = document.getElementById("rooms");

        rooms.forEach(element => {
            let room = document.createElement('div');
            room.classList.add('room');

            let info = document.createElement('div');
            info.classList.add('info');

            let photo = document.createElement('img');
            photo.src = element['img'];
            photo.alt = element['name'];

            let title = document.createElement('h1');
            title.textContent = element['name'];

            let description = document.createElement('p');
            description.textContent = element['description'];

            let price_block = document.createElement('div');
            price_block.classList.add('price_block');

            let price = document.createElement('p');
            price.textContent = element['price'];

            let price_button = document.createElement('button');
            price_button.textContent = "Детальніше";
            
            price_button.onclick = function () {
                window.location.href = `https://${element['link']}`;
            };

            price_block.appendChild(price);
            price_block.appendChild(price_button);

            info.appendChild(title);
            info.appendChild(description);
            info.appendChild(price_block);

            room.appendChild(photo);
            room.appendChild(info);

            rooms_container.appendChild(room);
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        const calendar = document.getElementById('calendar');

        create_calendar();
        get_dates(2026, 9, calendar);
        fill_rooms();
    });
</script>
{% endblock %}
