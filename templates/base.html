<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Вільні вітри</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.jpg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    {% block style %}{% endblock %}
</head>

<body>
    {% block header %}{% endblock %}

    <main class="app-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="flash-message {{ category }}" role="status">{{ message }}</div>{% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <script>
        const freewindsTelegramWebApp = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (freewindsTelegramWebApp) {
            freewindsTelegramWebApp.ready();
            freewindsTelegramWebApp.expand();
            document.documentElement.classList.add("telegram-webapp");
        }
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
